name: PS Vita

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install VitaSDK
        run: |
          export VITASDK=$HOME/vitasdk
          curl -fsSL https://raw.githubusercontent.com/vitasdk/vdpm/master/bootstrap-vitasdk.sh -o bootstrap-vitasdk.sh
          bash bootstrap-vitasdk.sh --install-dir "$VITASDK"
          echo "VITASDK=$VITASDK" >> "$GITHUB_ENV"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Build VPK
        run: |
          set -o pipefail
          prboom2/vita/build.sh --deps 2>&1 | tee build.log

      # Surface the build errors as annotations so they are readable
      # from the checks API without downloading the full log.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -nE "error|Error|undefined reference|not found|No such file|cannot find|FAILED|fatal" build.log \
            | grep -v "Werror" | head -120 > errors.txt || true
          echo "---- tail ----" >> errors.txt
          tail -90 build.log >> errors.txt
          split -l 12 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=build ${f#chunk_}::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dsda-doom-vita
          path: prboom2/build-vita/src/dsda-doom.vpk
